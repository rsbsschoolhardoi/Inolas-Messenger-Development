    <script>
      (function() {
        try {
          var override = localStorage.getItem('zenoa_theme_override');
          var isDark = override ? (override === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      .skip-link {

      .skip-link:focus {

        left: 1rem;
        padding: 0.625rem 1.25rem;
        background-color: #533afd;
        color: #ffffff;
        font-weight: 600;
        border-radius: 0.5rem;
        box-shadow: 0 4px 12px rgba(83, 58, 253, 0.35);
        outline: 2px solid #ffffff;

      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #fafbfc;
        z-index: 99999;
      }
      .dark #initial-loader {

      .loader-pulse {
        width: 32px;
        height: 32px;
        border: 2.5px solid rgba(83, 58, 253, 0.18);

        border-radius: 50%;
        animation: spin 0.7s linear infinite;
